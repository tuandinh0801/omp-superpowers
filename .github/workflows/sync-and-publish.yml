name: Sync Skills and Publish

on:
  schedule:
    # Daily 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "obra/superpowers ref or branch to sync"
        required: false
        default: "main"
      force_publish:
        description: "Force bump version and publish even if no skill diff"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  sync:
    name: Sync skills & check changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync skills
        run: bash scripts/sync-skills.sh "${{ inputs.ref || 'main' }}"

      - name: Check for changes
        id: check
        run: |
          if [ -n "$(git status --porcelain)" ] || [ "${{ inputs.force_publish }}" = "true" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected in skills."
          fi

      - name: Run tests
        if: steps.check.outputs.has_changes == 'true'
        run: npm test

      - name: Bump version and commit
        id: bump
        if: steps.check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NEW_TAG=$(npm version patch --no-git-tag-version)
          VERSION="${NEW_TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git add -A
          git commit -m "chore: auto-sync superpowers skills to v$VERSION [skip ci]"
          git tag "v$VERSION"
          git push origin main
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --notes "Auto-synced skills from obra/superpowers (${{ inputs.ref || 'main' }})"

  publish:
    name: Publish
    needs: sync
    if: needs.sync.outputs.has_changes == 'true'
    uses: ./.github/workflows/publish-npm.yml
    with:
      version: ${{ needs.sync.outputs.version }}
      ref: v${{ needs.sync.outputs.version }}
    secrets: inherit
